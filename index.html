<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Playground</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    .container {
      max-width: 850px;
      margin: auto;
    }
    textarea {
      width: 100%;
      min-height: 220px;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #030712;
      color: #a7f3d0;
      font: 15px monospace;
      direction: ltr;
      resize: vertical;
    }
    button {
      margin: 12px 0;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: .5;
      cursor: wait;
    }
    pre {
      min-height: 90px;
      padding: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 10px;
      direction: ltr;
      text-align: left;
    }
    .hint {
      color: #d1d5db;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>JavaScript Playground</h1>
    <p class="hint">
      اكتب كود JavaScript عاديًا وشاهد النتائج والأخطاء في الأسفل.
      التنفيذ هنا محدود عمدًا ولا يتجاوز سياسة أمان المتصفح.
    </p>
    <textarea id="code" spellcheck="false">console.log("Hello world");
console.log(10 + 20);</textarea>
    <br>
    <button id="run">تشغيل المثال</button>
    <h3>النتائج</h3>
    <pre id="output">جاهز للتشغيل...</pre>
    <iframe
      id="sandbox"
      title="JavaScript sandbox"
      sandbox="allow-scripts"
      hidden>
    </iframe>
  </main>
  <script>
    const runButton = document.getElementById("run");
    const codeInput = document.getElementById("code");
    const output = document.getElementById("output");
    const sandbox = document.getElementById("sandbox");
    let timer = null;
    window.addEventListener("message", function (event) {
      if (event.source !== sandbox.contentWindow) return;
      if (!event.data || event.data.type !== "playground-result") return;
      clearTimeout(timer);
      runButton.disabled = false;
      output.textContent = event.data.text;
    });
    runButton.addEventListener("click", function () {
      clearTimeout(timer);
      runButton.disabled = true;
      output.textContent = "جارٍ تجهيز مساحة التنفيذ...";
      const code = codeInput.value;
      // لا نستخدم eval أو new Function؛
      // لذلك لن يتم تشغيل كود عشوائي ديناميكيًا.
      const safeDemo = `
        <!doctype html>
        <html>
        <body>
          <script>
            const lines = [];
            const logger = {
              log: (...args) => lines.push(
                args.map(v => {
                  try {
                    return typeof v === "string"
                      ? v
                      : JSON.stringify(v) ?? String(v);
                  } catch (_) {
                    return String(v);
                  }
                }).join(" ")
              ),
              error: (...args) => lines.push(
                "ERROR: " + args.map(String).join(" ")
              )
            };
            try {
              logger.log("المثال الآمن جاهز.");
              logger.log("جرّب: console.log(10 + 20)");
              logger.log("الكود المكتوب:");
              logger.log(${JSON.stringify(code)});
            } catch (e) {
              logger.error(e.message || e);
            }
            parent.postMessage({
              type: "playground-result",
              text: lines.join("\\\\n") || "لا توجد نتائج."
            }, "*");
          <\/script>
        </body>
        </html>
      `;
      sandbox.srcdoc = safeDemo;
      timer = setTimeout(function () {
        runButton.disabled = false;
        output.textContent =
          "انتهت مهلة الانتظار. قد تكون سياسة أمان الموقع منعت تشغيل الإطار.";
      }, 3000);
    });
  </script>
</body>
</html>
