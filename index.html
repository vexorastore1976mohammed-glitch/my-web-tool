
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أداتي 💜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #171522;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #221e32;
      border: 1px solid #39304f;
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 12px 40px #0004;
    }

    h1 {
      color: #c4a5ff;
    }

    p {
      color: #d0c9df;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      margin: 18px 0;
      padding: 14px;
      border: 1px solid #51436f;
      border-radius: 12px;
      background: #171522;
      color: white;
      font: 14px monospace;
      direction: ltr;
      text-align: left;
      resize: vertical;
    }

    button {
      background: #8b5cf6;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 13px 28px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #7441e8;
    }

    #result {
      margin-top: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      text-align: left;
      direction: ltr;
      background: #171522;
      padding: 12px;
      border-radius: 10px;
      min-height: 44px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>أداتي 💜</h1>
    <p>اكتب كود JavaScript وجربه في مساحة معزولة.</p>

    <textarea id="code" placeholder="مثال:
console.log('أهلًا يا زلمة!');
2 + 3"></textarea>

    <br>
    <button id="runButton">تشغيل الكود</button>

    <div id="result" role="status">جاهز للتجربة ✨</div>
  </main>

  <script>
    const codeInput = document.getElementById("code");
    const result = document.getElementById("result");
    const runButton = document.getElementById("runButton");

    runButton.addEventListener("click", runTool);

    function runTool() {
      const code = codeInput.value.trim();

      if (!code) {
        result.textContent = "اكتب الكود أولًا.";
        return;
      }

      result.textContent = "جارٍ التشغيل...";

      const frame = document.createElement("iframe");
      frame.setAttribute("sandbox", "allow-scripts");
      frame.setAttribute("title", "بيئة تشغيل JavaScript");
      frame.style.display = "none";

      let finished = false;

      function cleanup() {
        window.removeEventListener("message", onMessage);
        frame.remove();
        runButton.disabled = false;
        runButton.textContent = "تشغيل الكود";
      }

      function onMessage(event) {
        if (event.source !== frame.contentWindow) return;

        const data = event.data;
        if (!data || data.channel !== "js-tool") return;

        if (data.type === "log") {
          result.textContent = data.text;
        } else if (data.type === "error") {
          result.textContent = "خطأ: " + data.text;
        } else if (data.type === "done") {
          finished = true;
          if (!data.logged) {
            result.textContent = "تم تشغيل الكود بنجاح.";
          }
          cleanup();
        }
      }

      window.addEventListener("message", onMessage);

      frame.onload = function () {
        const runner = `
          (() => {
            let logged = false;

            console.log = (...args) => {
              logged = true;
              parent.postMessage({
                channel: "js-tool",
                type: "log",
                text: args.map(String).join(" ")
              }, "*");
            };

            try {
              const fn = new Function(
                "console",
                '"use strict";\\n' +
                ${JSON.stringify(code)}
              );

              const value = fn(console);

              if (value !== undefined) {
                console.log(value);
              }

              parent.postMessage({
                channel: "js-tool",
                type: "done",
                logged
              }, "*");
            } catch (error) {
              parent.postMessage({
                channel: "js-tool",
                type: "error",
                text: error.message
              }, "*");

              parent.postMessage({
                channel: "js-tool",
                type: "done",
                logged: true
              }, "*");
            }
          })();
        `;

        const script = frame.contentDocument.createElement("script");
        script.textContent = runner;
        frame.contentDocument.body.appendChild(script);
      };

      runButton.disabled = true;
      runButton.textContent = "جارٍ التشغيل...";
      document.body.appendChild(frame);

      setTimeout(() => {
        if (!finished) {
          result.textContent =
            "انتهى الوقت؛ قد يكون الكود عالقًا أو لم يُكمل التشغيل.";
          cleanup();
        }
      }, 3000);
    }
  </script>
</body>
</html>
