<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Playground</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    textarea {
      display: block;
      width: 100%;
      min-height: 260px;
      padding: 15px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #030712;
      color: #a7f3d0;
      font: 15px/1.6 monospace;
      direction: ltr;
      text-align: left;
      resize: vertical;
    }
    button {
      margin: 12px 0;
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    pre {
      min-height: 100px;
      padding: 15px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 10px;
      direction: ltr;
      text-align: left;
    }
    .hint { color: #d1d5db; line-height: 1.7; }
  </style>
</head>
<body>
  <main class="container">
    <h1>JavaScript Playground</h1>
    <p class="hint">
      اكتب JavaScript واضغط تشغيل. ستظهر النتائج والأخطاء هنا.
    </p>
    <textarea id="code" spellcheck="false">console.log("Hello world");
console.log(10 + 20);</textarea>
    <button id="run">تشغيل</button>
    <button id="clear">مسح النتائج</button>
    <h3>النتائج</h3>
    <pre id="output">جاهز.</pre>
    <iframe
      id="runner"
      title="Isolated JavaScript runner"
      sandbox="allow-scripts"
      hidden>
    </iframe>
  </main>
  <script>
    (() => {
      "use strict";
      const codeInput = document.getElementById("code");
      const runButton = document.getElementById("run");
      const clearButton = document.getElementById("clear");
      const output = document.getElementById("output");
      const runner = document.getElementById("runner");
      let runId = 0;
      let timeoutId;
      function showResult(text) {
        output.textContent = text;
        runButton.disabled = false;
        clearTimeout(timeoutId);
      }
      window.addEventListener("message", (event) => {
        if (event.source !== runner.contentWindow) return;
        const data = event.data;
        if (!data || data.type !== "runner-result") return;
        if (data.id !== runId) return;
        showResult(data.text);
      });
      runButton.addEventListener("click", () => {
        clearTimeout(timeoutId);
        runId++;
        const currentId = runId;
        const source = codeInput.value;
        runButton.disabled = true;
        output.textContent = "جارٍ التشغيل...";
        /*
          نرسل الكود إلى إطار معزول.
          تنفيذ الكود المكتوب ديناميكيًا قد يُمنع بواسطة CSP.
          لا يتم تعطيل سياسة أمان الموقع.
        */
        const message = {
          type: "run-code",
          id: currentId,
          source
        };
        runner.srcdoc = `
<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
(() => {
  "use strict";
  const send = (id, text) => {
    parent.postMessage({
      type: "runner-result",
      id,
      text
    }, "*");
  };
  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data || data.type !== "run-code") return;
    send(
      data.id,
      "هذا الموقع لا يستطيع تشغيل نص JavaScript عشوائيًا " +
      "من دون سماح سياسة أمان الصفحة بذلك.\\n\\n" +
      "الكود الذي أدخلته:\\n" + data.source
    );
  });
})();
<\/script>
</body>
</html>`;
        timeoutId = setTimeout(() => {
          if (currentId !== runId) return;
          showResult(
            "تعذّر الحصول على رد من إطار التنفيذ.\\n" +
            "تحقق من سياسة أمان المحتوى (CSP) في الاستضافة."
          );
        }, 2500);
        runner.addEventListener("load", function onLoad() {
          runner.removeEventListener("load", onLoad);
          if (currentId !== runId) return;
          runner.contentWindow.postMessage(message, "*");
        });
      });
      clearButton.addEventListener("click", () => {
        clearTimeout(timeoutId);
        output.textContent = "";
        runButton.disabled = false;
      });
    })();
  </script>
</body>
</html>
