
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مشغل JavaScript 💜</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      box-sizing: border-box;
      background: #171522;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 24px;
      background: #221e32;
      border-radius: 18px;
    }
    textarea {
      width: 100%;
      height: 200px;
      box-sizing: border-box;
      padding: 14px;
      background: #100f18;
      color: #fff;
      border: 1px solid #51436f;
      border-radius: 10px;
      direction: ltr;
      text-align: left;
      font: 15px monospace;
    }
    button {
      margin-top: 14px;
      padding: 12px 24px;
      background: #8b5cf6;
      color: white;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #100f18;
      padding: 14px;
      border-radius: 10px;
      direction: ltr;
      text-align: left;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <main>
    <h1>مشغل JavaScript 💜</h1>
    <p>اكتب كود JavaScript عادي واضغط تشغيل.</p>

    <textarea id="code">console.log("اشتغل يا زلمة!");
2 + 3;</textarea>

    <br>
    <button id="run">تشغيل الكود</button>

    <h3>النتيجة:</h3>
    <pre id="output">جاهز للتشغيل.</pre>

    <iframe
      id="runner"
      sandbox="allow-scripts"
      title="بيئة تشغيل معزولة"
      hidden>
    </iframe>
  </main>

  <script>
    const code = document.getElementById("code");
    const output = document.getElementById("output");
    const runner = document.getElementById("runner");
    const button = document.getElementById("run");

    let timer;

    window.addEventListener("message", event => {
      if (event.source !== runner.contentWindow) return;
      if (event.data?.channel !== "runner") return;

      if (event.data.type === "result") {
        output.textContent = event.data.text;
      }

      if (event.data.type === "finished") {
        clearTimeout(timer);
        button.disabled = false;
        button.textContent = "تشغيل الكود";
      }
    });

    button.addEventListener("click", () => {
      const source = code.value;

      if (!source.trim()) {
        output.textContent = "اكتب الكود أولًا.";
        return;
      }

      clearTimeout(timer);
      button.disabled = true;
      button.textContent = "جارٍ التشغيل...";
      output.textContent = "جارٍ التشغيل...";

      const documentContent = `<!doctype html>
<html><body><script>
(async () => {
  let lines = [];
  const send = (type, text) =>
    parent.postMessage({channel:"runner",type,text}, "*");

  const safeConsole = {
    log: (...args) => {
      lines.push(args.map(String).join(" "));
      send("result", lines.join("\\n"));
    },
    error: (...args) => {
      lines.push("خطأ: " + args.map(String).join(" "));
      send("result", lines.join("\\n"));
    },
    warn: (...args) => {
      lines.push(args.map(String).join(" "));
      send("result", lines.join("\\n"));
    }
  };

  try {
    const fn = new Function("console", ${JSON.stringify(
      '"use strict";\\n' + source
    )});
    const value = fn(safeConsole);
    if (value !== undefined) {
      lines.push(String(value));
    }
    send("result", lines.join("\\n") || "تم التشغيل بنجاح.");
  } catch (e) {
    send("result", "خطأ: " + e.message);
  } finally {
    send("finished", "");
  }
})();
<\/script></body></html>`;

      runner.srcdoc = documentContent;

      timer = setTimeout(() => {
        output.textContent =
          "انتهت المهلة. قد يكون الكود لا ينتهي أو غير متوافق.";
        button.disabled = false;
        button.textContent = "تشغيل الكود";
      }, 3000);
    });
  </script>
</body>
</html>
